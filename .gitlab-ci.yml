# R package CI for GitLab: R CMD check, lint and spelling on every push and
# merge request; the pkgdown website is built and published to GitLab Pages
# from the default branch.
image: rocker/geospatial:4.5

variables:
  NOT_CRAN: "true"
  R_KEEP_PKG_SOURCE: "yes"
  _R_CHECK_FORCE_SUGGESTS_: "false"
  R_LIBS_USER: "$CI_PROJECT_DIR/.R-lib"
  PAK_CACHE_DIR: "$CI_PROJECT_DIR/.pak-cache"

cache:
  key: "r-$CI_COMMIT_REF_SLUG"
  paths:
    - .R-lib/
    - .pak-cache/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  before_script:
    - mkdir -p "$R_LIBS_USER"
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'

stages:
  - check
  - website

check:
  stage: check
  script:
    - Rscript -e 'pak::local_install_dev_deps(upgrade = FALSE); pak::pkg_install("rcmdcheck")'
    - Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", build_args = "--no-manual", error_on = "warning", check_dir = "check")'
  artifacts:
    when: always
    paths:
      - check/*.Rcheck/00check.log
      - check/*.Rcheck/tests/
    expire_in: 2 weeks

# Full CRAN check (PDF manual included), as CRAN's incoming checks run it.
cran:
  stage: check
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends qpdf tidy texinfo texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra >/dev/null
    - Rscript -e 'pak::local_install_dev_deps(upgrade = FALSE); pak::pkg_install("rcmdcheck")'
    - mkdir -p cran-check && (R CMD Rd2pdf --no-preview --force --output=cran-check/manual.pdf . > cran-check/manual-build.log 2>&1 || cp -f .Rd2pdf*/Rd2.log cran-check/ 2>/dev/null || true)
    - _R_CHECK_CRAN_INCOMING_=true _R_CHECK_FORCE_SUGGESTS_=false Rscript -e 'rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "warning", check_dir = "cran-check")'
  artifacts:
    when: always
    paths:
      - cran-check/*.Rcheck/00check.log
      - cran-check/*.log
      - cran-check/*.Rcheck/*.log
    expire_in: 4 weeks
  # About 25 minutes with LaTeX: run on the default branch and tags only
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: check
  script:
    - Rscript -e 'pak::local_install_dev_deps(upgrade = FALSE); pak::pkg_install(c("lintr", "spelling", "local::."))'
    - LINTR_ERROR_ON_LINT=true Rscript -e 'lintr::lint_package()'
    # spelling has no en-NZ dictionary, so check against en-GB.
    - >-
      Rscript -e 'files <- c(list.files("man", "\\.Rd$", full.names = TRUE),
      list.files("vignettes", "\\.Rmd$", full.names = TRUE, recursive = TRUE),
      "README.Rmd", "NEWS.md", "DESCRIPTION");
      bad <- spelling::spell_check_files(files,
      ignore = readLines("inst/WORDLIST", encoding = "UTF-8"), lang = "en_GB");
      print(bad); if (nrow(bad) > 0) stop("Fix the spelling or add the words to inst/WORDLIST.")'

pages:
  stage: website
  # Waits for the CRAN check so its report is published on the website
  needs:
    - job: cran
      artifacts: true
      optional: true
  script:
    - Rscript -e 'pak::local_install_dev_deps(upgrade = FALSE); pak::pkg_install(c("pkgdown", "local::."))'
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE, override = list(destination = "public"))'
    - cp cran-check/tidydiversity.Rcheck/00check.log public/cran-check.txt || true
  artifacts:
    paths:
      - public
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
