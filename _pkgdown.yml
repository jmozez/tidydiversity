url: https://jmozez.github.io/tidydiversity/

template:
  bootstrap: 5
  includes:
    # Tell browsers the site has its own light and dark themes, so their
    # automatic dark mode does not invert (darken) the figures.
    in_header: <meta name="color-scheme" content="light dark">
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "tidydiversity hex logo"
  light-switch: true
  bslib:
    primary: "#1A9E93"
    secondary: "#0E2A47"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: 1rem
    line-height-base: 1.65
    headings-font-weight: 700
    link-color: "#13857B"
    navbar-bg: "#0E2A47"
    border-radius: 0.5rem

navbar:
  bg: dark
  structure:
    left: [intro, tutorials, gallery, modelling, publication, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/tidydiversity.html
    tutorials:
      text: Tutorials
      menu:
        - text: Overview by taxon
          href: articles/tutorials.html
        - text: -------
        - text: Papua New Guinea
        - text: Ants along Mt Wilhelm and in canopies
          href: articles/case-png-ants.html
        - text: Frogs along Mt Wilhelm
          href: articles/case-png-frogs.html
        - text: Butterflies at Wanang
          href: articles/case-png-butterflies.html
        - text: -------
        - text: Other regions
        - text: Insects (caddisflies)
          href: articles/case-insects.html
        - text: Mammals (desert rodents)
          href: articles/case-mammals.html
        - text: Birds (Taiwan and North America)
          href: articles/case-birds.html
        - text: Plants (Barro Colorado Island trees)
          href: articles/case-plants.html
        - text: -------
        - text: Guides
        - text: "TD, PD and FD on one scale"
          href: articles/dimensions.html
        - text: Alpha diversity and rarefaction
          href: articles/alpha-rarefaction.html
        - text: Beta diversity partitioning
          href: articles/beta-partitioning.html
    gallery:
      text: Gallery
      href: articles/gallery.html
    modelling:
      text: Modelling
      menu:
        - text: Models of diversity estimates
          href: articles/modelling.html
        - text: "Ordination: biplots and triplots"
          href: articles/ordination.html
    news:
      text: News
      href: news/index.html
    publication:
      text: Publication figures
      href: articles/publication.html

home:
  title: "tidydiversity: taxonomic, phylogenetic and functional diversity in R"
  description: >
    Taxonomic, phylogenetic and functional diversity as Hill numbers of the
    same order q, standardised by sample size or coverage, in one tidy R
    workflow, demonstrated on published field data from Papua New Guinea.
    Estimates match iNEXT and iNEXT.3D.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

reference:
  - title: Community data
    contents:
      - as_community
      - add_site_data
  - title: Datasets
    contents:
      - png_ants
      - png_tree_ants
      - png_frogs
      - wanang_butterflies
      - portal_rodents
  - title: Alpha diversity
    contents:
      - div_hill
      - div_estimate
      - div_coverage
  - title: Completeness and evenness
    contents:
      - div_completeness
      - div_evenness
  - title: Rarefaction and standardisation
    contents:
      - div_rarefy
      - div_standardise
      - div_boot
  - title: Beta diversity
    contents:
      - beta_pair
      - beta_decay
      - beta_dist
  - title: Ordination
    contents:
      - ord_fit
      - ord_test
      - autoplot.td_ordination
      - tidy.td_ordination
  - title: Plots and tables for publication
    contents:
      - autoplot-tidydiversity
      - theme_tidydiversity
      - div_table
  - title: Modelling
    contents:
      - tidy-tidydiversity

articles:
  - title: Get started
    navbar: ~
    contents:
      - tidydiversity
  - title: Guides
    contents:
      - articles/dimensions
      - alpha-rarefaction
      - beta-partitioning
      - articles/modelling
      - articles/ordination
      - articles/publication
  - title: Papua New Guinea case studies
    contents:
      - articles/case-png-ants
      - articles/case-png-frogs
      - articles/case-png-butterflies
  - title: Real-world tutorials
    contents:
      - articles/tutorials
      - articles/case-insects
      - articles/case-mammals
      - articles/case-birds
      - articles/case-plants
  - title: Gallery
    contents:
      - articles/gallery

footer:
  structure:
    left: [developed_by]
    right: [built_with]
