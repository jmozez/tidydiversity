url: https://jmozez.github.io/tidydiversity/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#14a7b4"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    link-color: "#0f8a95"
    navbar-bg: "#0f2742"

navbar:
  bg: dark
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

home:
  title: Tidy biodiversity estimation with Hill numbers

reference:
  - title: Community data
    contents:
      - as_community
      - ant_gradient
  - title: Alpha diversity
    contents:
      - div_hill
      - div_estimate
      - div_coverage
  - title: Rarefaction and standardisation
    contents:
      - div_rarefy
      - div_standardise
  - title: Beta diversity
    contents:
      - beta_pair
      - beta_decay
  - title: Plotting
    contents:
      - autoplot-tidydiversity

