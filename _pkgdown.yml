url: https://jmozez.github.io/tidydiversity/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#14a7b4"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    link-color: "#0f8a95"
    navbar-bg: "#0f2742"

navbar:
  bg: dark
  structure:
    left: [intro, gallery, reference, articles, news]
  components:
    gallery:
      text: Gallery
      href: articles/gallery.html
    right: [search, github, lightswitch]

home:
  title: Tidy biodiversity estimation with Hill numbers

reference:
  - title: Community data
    contents:
      - as_community
      - add_site_data
  - title: Datasets
    contents:
      - ant_gradient
      - portal_rodents
  - title: Alpha diversity
    contents:
      - div_hill
      - div_estimate
      - div_coverage
  - title: Rarefaction and standardisation
    contents:
      - div_rarefy
      - div_standardise
      - div_boot
  - title: Beta diversity
    contents:
      - beta_pair
      - beta_decay
      - beta_dist
  - title: Plots and tables for publication
    contents:
      - autoplot-tidydiversity
      - theme_tidydiversity
      - div_table
  - title: Modelling
    contents:
      - tidy-tidydiversity

articles:
  - title: Guides
    navbar: ~
    contents:
      - alpha-rarefaction
      - beta-partitioning
      - publication
      - modelling
  - title: Real-world case studies
    navbar: Case studies
