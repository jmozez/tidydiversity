url: https://tidydiversity.in4metrix.dev/

template:
  bootstrap: 5
  includes:
    # Readers can switch the site between light and dark (light-switch
    # below); plots keep a white background in both (extra.css).
    # The CSP allows only the site's own scripts; GitHub Pages cannot send
    # security headers, so they are set as meta tags.
    in_header: |
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
      <meta name="referrer" content="strict-origin-when-cross-origin">
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "tidydiversity hex logo"
  light-switch: true
  bslib:
    primary: "#1A9E93"
    secondary: "#0E2A47"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: 1rem
    line-height-base: 1.65
    headings-font-weight: 700
    link-color: "#13857B"
    navbar-bg: "#0E2A47"
    border-radius: 0.5rem

# Every figure, including reference-page examples, on an opaque white
# background so no plot ever shows the dark theme through it.
figures:
  bg: white
  dev.args:
    bg: white

repo:
  url:
    home: https://github.com/jmozez/tidydiversity/
    source: https://github.com/jmozez/tidydiversity/blob/main/
    issue: https://github.com/jmozez/tidydiversity/issues/
    user: https://gitlab.com/
  branch: main

