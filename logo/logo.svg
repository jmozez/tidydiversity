<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14365A"/><stop offset="1" stop-color="#0B2340"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E5F8A"/><stop offset="1" stop-color="#1B4670"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3CF7A"/><stop offset="1" stop-color="#C99A3E"/>
    </linearGradient>
    <clipPath id="hex"><path d="M260 14 L506 156 L506 444 L260 586 L14 444 L14 156 Z"/></clipPath>
  </defs>

  <!-- Hexagon -->
  <path d="M260 14 L506 156 L506 444 L260 586 L14 444 L14 156 Z" fill="url(#bg)"/>

  <g clip-path="url(#hex)">
    <!-- Mountains -->
    <path d="M70 330 L178 196 L238 270 L330 152 L452 330 Z" fill="url(#mtn)"/>
    <!-- Snow caps -->
    <path d="M178 196 L199 222 L190 218 L182 228 L172 219 L160 219 Z" fill="#DCE6F0"/>
    <path d="M330 152 L357 187 L345 181 L334 194 L322 182 L306 183 Z" fill="#E9F0F6"/>

    <!-- Phylogenetic branching inside the peaks (ultrametric tree, tips on the ground line) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#D7E5F1" stroke-width="5">
        <path d="M330 196 V226 H290 V252 M330 226 H372 V252"/>
        <path d="M178 236 V258 H150 V282 M178 258 H206 V282"/>
      </g>
      <g stroke="#A9C6E0" stroke-width="4">
        <path d="M290 252 H268 V280 M290 252 H312 V280 M372 252 H350 V280 M372 252 H396 V280"/>
        <path d="M150 282 H134 V300 M150 282 H164 V300 M206 282 H192 V300 M206 282 H220 V300"/>
      </g>
      <g stroke="#7FA4C8" stroke-width="3">
        <path d="M268 280 H258 V318 M268 280 H278 V318 M312 280 H302 V318 M312 280 H322 V318"/>
        <path d="M350 280 H340 V318 M350 280 H360 V318 M396 280 H386 V318 M396 280 H410 V318"/>
        <path d="M134 300 V318 M164 300 V318 M192 300 V318 M220 300 V318"/>
      </g>
    </g>

    <!-- Ground line -->
    <rect x="40" y="330" width="440" height="7" rx="3.5" fill="#2BB3A6"/>

    <!-- Taxa row: gold line art on a shared stroke, scaled to sit inside the hexagon -->
    <g transform="translate(58 354) scale(0.8)" fill="none" stroke="url(#gold)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Earthworm -->
      <path d="M2 36 C2 16 26 14 28 28 C30 42 50 46 52 32 C53 22 64 18 70 26"/>
      <path d="M10 24 l3 4 M20 19 l0 5 M34 39 l4 -3 M44 42 l1 -5"/>
      <!-- Mushrooms -->
      <path d="M86 28 C86 6 128 6 128 28 Z"/>
      <path d="M101 28 C99 38 99 46 97 52 H117 C115 46 115 38 113 28"/>
      <path d="M96 18 h4 M110 13 h5 M120 20 h3"/>
      <path d="M126 44 C126 33 146 33 146 44 Z M133 44 V52 H139 V44"/>
      <!-- Ant, side view -->
      <circle cx="170" cy="30" r="7"/>
      <ellipse cx="186" cy="31" rx="9" ry="5"/>
      <circle cx="199" cy="32" r="3"/>
      <ellipse cx="216" cy="32" rx="13" ry="9"/>
      <path d="M166 24 C162 14 156 12 152 14 M171 23 C170 13 166 9 160 9"/>
      <path d="M180 35 L172 50 M186 36 L186 52 M192 35 L202 50"/>
      <!-- Frog -->
      <path d="M248 50 C242 32 252 18 268 18 C284 18 294 32 288 50 Z"/>
      <circle cx="259" cy="18" r="6"/><circle cx="277" cy="18" r="6"/>
      <path d="M248 50 C240 52 238 56 244 58 M288 50 C296 52 298 56 292 58 M260 36 C264 40 272 40 276 36"/>
      <!-- Bird of paradise head with plume -->
      <path d="M318 50 C312 32 322 16 340 16 C352 16 360 24 362 30 L384 34 L362 38 C358 46 348 52 336 52 Z"/>
      <circle cx="346" cy="27" r="2.6" fill="#F3CF7A" stroke="none"/>
      <path d="M322 26 C310 22 304 12 308 2 M326 22 C320 12 322 4 330 0"/>
      <!-- Butterfly -->
      <path d="M422 30 C410 8 390 8 392 24 C394 36 410 38 422 34 C410 40 402 52 412 54 C420 55 422 44 422 36"/>
      <path d="M422 30 C434 8 454 8 452 24 C450 36 434 38 422 34 C434 40 442 52 432 54 C424 55 422 44 422 36"/>
      <path d="M422 22 V50 M422 22 L417 12 M422 22 L427 12"/>
      <!-- Leaf -->
      <path d="M470 56 C464 32 476 12 500 8 C504 32 494 52 470 56 Z"/>
      <path d="M470 56 L494 16 M478 42 l-7 -5 M486 30 l-7 -4"/>
    </g>
  </g>

  <!-- Border on top -->
  <path d="M260 14 L506 156 L506 444 L260 586 L14 444 L14 156 Z" fill="none" stroke="#2BB3A6" stroke-width="20" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="260" y="462" text-anchor="middle" font-family="Inter, 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif" font-weight="800" font-size="50" letter-spacing="-0.3" fill="#FFFFFF">tidydiversity</text>
  <rect x="206" y="482" width="108" height="5" rx="2.5" fill="#2BB3A6"/>
</svg>
