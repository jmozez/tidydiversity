# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Each Linux job's Azure apt mirror is sometimes ~40 kB/s, which made
      # setup-r take 20+ min. Time a small download from three mirrors, use
      # the fastest, and make apt retry a stalled connection.
      - name: Pick a fast Ubuntu mirror
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-retries
          . /etc/os-release
          azure=http://azure.archive.ubuntu.com/ubuntu
          best=$azure; best_speed=0
          for m in $azure http://archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu; do
            s=$(curl -s -o /dev/null --max-time 10 -w '%{speed_download}' \
              "$m/dists/$VERSION_CODENAME/main/binary-amd64/Packages.gz" || true)
            s=${s%.*}; s=${s:-0}
            echo "$m: $((s / 1024)) kB/s"
            if [ "$s" -gt "$best_speed" ]; then best=$m; best_speed=$s; fi
          done
          echo "Using $best"
          if [ "$best" != "$azure" ]; then
            sudo sed -i "s|$azure|$best|g" /etc/apt/apt-mirrors.txt \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          fi

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::lintr, any::spelling, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      # spelling has no en-NZ dictionary, so check against en-GB.
      - name: Spelling
        run: |
          files <- c(
            list.files("man", "\\.Rd$", full.names = TRUE),
            list.files("vignettes", "\\.Rmd$", full.names = TRUE, recursive = TRUE),
            "README.Rmd", "NEWS.md", "DESCRIPTION"
          )
          bad <- spelling::spell_check_files(
            files, ignore = readLines("inst/WORDLIST"), lang = "en_GB"
          )
          print(bad)
          if (nrow(bad) > 0) {
            stop("Fix the spelling or add the words to inst/WORDLIST.")
          }
        shell: Rscript {0}
