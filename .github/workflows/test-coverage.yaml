# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Run the reference comparisons that tests skip on CRAN.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # On ubuntu-latest (now the 26.04 image) setup-r downloads ~200 apt
      # packages from an Azure mirror that is often slow (20+ min).
      # Pin 24.04 and make apt retry or give up on a stalled mirror quickly.
      - name: Make apt fail fast and retry
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("Coverage: %.1f%%\n", pct))
          cat(sprintf("COVERAGE=%.0f\n", pct), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Coverage summary
        run: echo "### Test coverage ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: cobertura.xml
